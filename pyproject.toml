[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cleankit"
version = "0.1.0"
description = "Profile, clean, validate and run reproducible, audited cleaning pipelines on messy CSVs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alejandro Brito" }]
keywords = ["data-cleaning", "pandas", "data-quality", "etl", "profiling", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.2"]

[project.urls]
Homepage = "https://github.com/AleBrito124356/data-cleaning-toolkit"
Repository = "https://github.com/AleBrito124356/data-cleaning-toolkit"

[project.scripts]
cleankit = "cleankit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
